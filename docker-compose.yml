services:
  backend:
    image: python:3.12-slim
    restart: unless-stopped

    working_dir: /app/backend

    volumes:
      - .:/app
      - backend_uploads:/app/backend/storage/uploads

    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn app.interfaces.api.main:app
             --host 0.0.0.0
             --port 8000"

    ports:
      - "127.0.0.1:8001:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://analytics:SENHA@postgresql:5432/mining_bd

    networks:
      - database_network

volumes:
  backend_uploads:

networks:
  database_network:
    external: true